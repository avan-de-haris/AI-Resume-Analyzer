{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card"></div>
        <h2>Create Account</h2>
        <p class="sub-text">Start your AI Career Journey with us today!</p>
        <form method="POST" action="/signup">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <p class="sub-text">Password must be at least 8 characters long.</p>
            </div>
            <button type="submit">Sign Up</button>
        </form>
        <p class="switch-auth">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}
