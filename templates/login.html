{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="sub-text">Log in to continue your AI Career Journey!</p>
        <form method="POST" action="/login">    
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
        <p class="sub-text">Forgot your password? <a href="/reset-password">Reset it here</a></p>
        <p class="switch-auth">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
